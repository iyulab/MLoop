name: Runtime smoke

# Drives the deep-learning runtimes end to end (scripts/runtime-smoke.sh): TensorFlow image classification —
# install, train, serve, POST /predict with images, then the model's lifecycle (staging, shadow prediction, promote, rollback) —
# libtorch text classification and object detection, and image anomaly (onnxruntime + an installed encoder). CI installs neither
# runtime, so these paths run nowhere else. Run on request when a runtime, its loading, or the image or text
# paths change, and every Sunday at 04:00 UTC (after the scheduled benchmarks, the day before the weekly release day), so that
# a regression on these paths shows up in a week and not at the next release. A Linux x64 runner runs the script's
# linux/amd64 container natively, without emulation.
on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      runtime:
        description: 'Which runtime to drive'
        type: choice
        options: [both, tf, torch, anomaly]
        default: both

concurrency:
  group: runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run
      run: ./scripts/runtime-smoke.sh ${{ inputs.runtime != 'both' && inputs.runtime || '' }}
