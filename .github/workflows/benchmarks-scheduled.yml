name: Benchmarks scheduled

# The engine comparison and the lifecycle walk, run on a schedule so that a regression shows up in a run instead of
# in whoever next remembers to start one. Linux x64, where the LightGBM native library is available.
#
#  * engine: the trainer search against FLAML and stand-alone LightGBM on the 16 public tables of benchmarks/engine-compare
#    (split seeds 0-4, 60 s budget). `run.py regress` then reads the run against the pinned baseline (below):
#    the search's verdict against FLAML (which ran in the same execution, so the runner's speed cancels) per table, and the run
#    fails when the number of tables where the search is behind FLAML rises by three or more. A table flipping to "behind"
#    or a rise of two is printed as a watch and does not fail the run.
#  * lifecycle: the generated-table walk for the tabular and series tasks (scripts/lifecycle-check.py) - train, promote, predict
#    with logs, drift, feedback, retrain, paired evaluation, rollback.
#
# The schedule runs the day before the weekly release day. The baseline a run is read against is the one PINNED at the last
# release, not the previous run: when the baseline followed the previous run, a "watch" (one more table behind, below the
# failing step) was accepted into the baseline each week and a slow slide never failed. A baseline is pinned by starting this
# workflow by hand with `pin_baseline` after a release (the run's results are then kept as the `bench-baseline` artifact for 90
# days); a scheduled run reads against the newest `bench-baseline` and never replaces it. With no pinned baseline yet, the first
# successful run pins itself. Every run's own results stay as the `bench-results` artifact for 30 days.
# Start it by hand with the same inputs to check a branch.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Comma-separated split seeds, one job each'
        default: '0,1,2,3,4'
      budget:
        description: 'Time budget in seconds for each searching system and dataset'
        default: '60'
      pin_baseline:
        description: 'Keep this run as the baseline later runs are read against (after a release, on the released commit)'
        type: boolean
        default: false

concurrency:
  group: benchmarks-scheduled-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seeds: ${{ steps.seeds.outputs.seeds }}
    steps:
    - name: Read the split seeds
      id: seeds
      env:
        SEEDS: ${{ inputs.seeds || '0,1,2,3,4' }}
      run: |
        if ! [[ "$SEEDS" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
          echo "seeds must be comma-separated non-negative integers, got: $SEEDS" >&2
          exit 1
        fi
        echo "seeds=[$SEEDS]" >> "$GITHUB_OUTPUT"

  engine:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      matrix:
        seed: ${{ fromJson(needs.plan.outputs.seeds) }}
      fail-fast: false
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python packages
      run: pip install flaml lightgbm xgboost scikit-learn pandas numpy

    - name: Build the CLI
      run: dotnet build tools/MLoop.CLI --configuration Release

    - name: Sweep
      env:
        BUDGET: ${{ inputs.budget || '60' }}
      run: >
        python benchmarks/engine-compare/run.py run
        --mloop "dotnet $PWD/tools/MLoop.CLI/bin/Release/net10.0/mloop.dll"
        --seeds ${{ matrix.seed }} --budget "$BUDGET"
        --systems mloop,flaml,lightgbm --out results-${{ matrix.seed }}.jsonl

    - name: Keep the results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bench-seed-${{ matrix.seed }}
        path: results-${{ matrix.seed }}.jsonl
        retention-days: 30

  regress:
    needs: [plan, engine]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - run: pip install numpy

    - name: Download this run's results
      uses: actions/download-artifact@v4
      with:
        pattern: bench-seed-*
        merge-multiple: true

    - name: Summarize
      shell: bash
      run: |
        ls results-*.jsonl
        python benchmarks/engine-compare/run.py summarize results-*.jsonl | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Find the pinned baseline
      id: base
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # The newest unexpired `bench-baseline` artifact and the run that made it.
        row=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=bench-baseline&per_page=20" \
          --jq '[.artifacts[] | select(.expired == false)][0] | select(. != null) | "\(.workflow_run.id) \(.created_at)"')
        if [ -n "$row" ]; then
          echo "run_id=${row%% *}" >> "$GITHUB_OUTPUT"
          echo "pinned_at=${row##* }" >> "$GITHUB_OUTPUT"
        fi

    - name: Read against the pinned baseline
      if: steps.base.outputs.run_id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_RUN: ${{ steps.base.outputs.run_id }}
        PINNED_AT: ${{ steps.base.outputs.pinned_at }}
      run: |
        gh run download "$BASE_RUN" --name bench-baseline --dir baseline
        { echo; echo "### Against the baseline pinned at $PINNED_AT (run $BASE_RUN)"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        python benchmarks/engine-compare/run.py regress --base baseline/bench-results.jsonl --candidate results-*.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Keep this run's results
      run: cat results-*.jsonl > bench-results.jsonl

    - name: Upload this run's results
      uses: actions/upload-artifact@v4
      with:
        name: bench-results
        path: bench-results.jsonl
        retention-days: 30

    # A run that failed the step above does not get here, so a regressed run is never pinned.
    - name: Pin this run as the baseline
      if: inputs.pin_baseline || steps.base.outputs.run_id == ''
      uses: actions/upload-artifact@v4
      with:
        name: bench-baseline
        path: bench-results.jsonl
        retention-days: 90

  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build the CLI
      run: dotnet build tools/MLoop.CLI -c Release

    - name: Time-series prerequisite
      # ML.NET's MKL native links an Intel-ABI OpenMP runtime that Linux leaves to the system
      run: |
        sudo apt-get install -y libomp5
        omp=$(find /usr/lib -name 'libomp.so.5' | head -n 1)
        sudo ln -sf "$omp" "$(dirname "$omp")/libiomp5.so"
        sudo ldconfig

    - name: Walk
      run: >
        python3 scripts/lifecycle-check.py
        --mloop "dotnet $PWD/tools/MLoop.CLI/bin/Release/net10.0/mloop.dll"
        --tasks binary,multiclass,regression,forecast,anomaly,clustering,outliers,ranking,recommendation
        --trials 10 --time 300 --no-serve --out lifecycle-results.json

    - name: Upload the results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lifecycle-scheduled
        path: lifecycle-results.json
        if-no-files-found: ignore
        retention-days: 30
