name: Lifecycle check

# Walks a model through its operating life with the real CLI (scripts/lifecycle-check.py): train, promote, predict with logs, drift,
# feedback, retraining trigger, retrain, paired evaluation, promote, rollback, retrain through a paired gate. The generated text
# scenario needs the libtorch runtime, which CI installs nowhere else, so it runs here on request; the forecasting scenario needs
# ML.NET's MKL native, whose OpenMP runtime this workflow installs. Linux x64.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Comma-separated scenarios (binary, multiclass, regression, text, forecast, anomaly)'
        default: 'text'
      expected:
        description: 'Steps known to fail (a step that turns green is reported as xpass)'
        default: ''
      serve:
        description: 'Also walk the HTTP surface (mloop serve; true or false)'
        default: 'false'
      trials:
        description: 'Trials of the trainer search per training (0 = the time budget alone)'
        default: '10'
      series_rows:
        description: 'Also walk the series tasks over series of these lengths (scripts/series-scale.py; comma-separated, empty = skip)'
        default: ''
      series_tasks:
        description: 'Series tasks for that walk (forecast, anomaly)'
        default: 'forecast,anomaly'
      series_windows:
        description: 'Forecast SSA window sizes to try at every length (comma-separated, empty = the default)'
        default: ''
      series_seeds:
        description: 'Series seeds for that walk (comma-separated; the noise differs)'
        default: '1'
      series_timeout:
        description: 'Seconds allowed to each step of the series walk (0 = 1800)'
        default: '0'
      series_vary:
        description: 'NAME=v1,v2,... runs the series walk once per value with that environment variable set'
        default: ''
      series_spike_every:
        description: 'Anomaly series: one spike every this many points'
        default: '1000'
      series_shape:
        description: 'Comma-separated shapes of the walked series (monthly, daily, trend, walk, growth, noise; see scripts/series-scale.py)'
        default: 'monthly'
      series_horizon:
        description: 'Comma-separated forecast horizons for the series walk'
        default: '10'
      table_rows:
        description: 'Also walk the tabular tasks over tables of these row counts (scripts/table-scale.py; comma-separated, empty = skip)'
        default: ''
      table_tasks:
        description: 'Tabular tasks for that walk (binary, multiclass, regression)'
        default: 'binary,multiclass,regression'
      table_classes:
        description: 'Class counts for that walk (2 = binary, the others multiclass)'
        default: '2,10,100'
      table_features:
        description: 'Numeric column counts for that walk (comma-separated)'
        default: '20'
      table_time:
        description: 'Training time ceiling in seconds for that walk'
        default: '60'
      table_seeds:
        description: 'Table seeds for that walk (comma-separated)'
        default: '1'

concurrency:
  group: lifecycle-check-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build the CLI
      run: dotnet build tools/MLoop.CLI -c Release

    - name: Time-series prerequisite
      if: contains(inputs.tasks, 'forecast') || contains(inputs.tasks, 'anomaly') || inputs.series_rows != ''
      # ML.NET's MKL native links an Intel-ABI OpenMP runtime that Linux leaves to the system (TimeSeriesNativeSupport)
      run: |
        sudo apt-get install -y libomp5
        omp=$(find /usr/lib -name 'libomp.so.5' | head -n 1)
        sudo ln -sf "$omp" "$(dirname "$omp")/libiomp5.so"
        sudo ldconfig

    - name: Build the API
      # `mloop serve` starts the API assembly beside the CLI or the one MLOOP_API_PATH names
      if: inputs.serve == 'true'
      run: dotnet build tools/MLoop.API -c Release

    - name: Walk
      if: inputs.tasks != ''
      env:
        TASKS: ${{ inputs.tasks }}
        TRIALS: ${{ inputs.trials }}
        EXPECTED: ${{ inputs.expected }}
        SERVE: ${{ inputs.serve }}
        MLOOP_API_PATH: ${{ github.workspace }}/tools/MLoop.API/bin/Release/net10.0/MLoop.API.dll
      run: |
        python3 scripts/lifecycle-check.py --mloop "dotnet $PWD/tools/MLoop.CLI/bin/Release/net10.0/mloop.dll" \
          --tasks "$TASKS" --trials "$TRIALS" --time 300 $([ "$SERVE" = true ] || echo --no-serve) --expected-failures "$EXPECTED" --server-log server.log --out lifecycle-results.json

    - name: Walk the series tasks over growing lengths
      if: inputs.series_rows != ''
      env:
        ROWS: ${{ inputs.series_rows }}
        TASKS: ${{ inputs.series_tasks }}
        WINDOWS: ${{ inputs.series_windows }}
        STEP_TIMEOUT: ${{ inputs.series_timeout }}
        SEEDS: ${{ inputs.series_seeds }}
        SHAPE: ${{ inputs.series_shape }}
        HORIZON: ${{ inputs.series_horizon }}
        SPIKE_EVERY: ${{ inputs.series_spike_every }}
        VARY: ${{ inputs.series_vary }}
      run: |
        python3 scripts/series-scale.py --mloop "dotnet $PWD/tools/MLoop.CLI/bin/Release/net10.0/mloop.dll" --rows "$ROWS" --tasks "$TASKS" --windows "$WINDOWS" --step-timeout "$STEP_TIMEOUT" --seeds "$SEEDS" --shape "$SHAPE" --horizon "$HORIZON" --spike-every "$SPIKE_EVERY" --vary "$VARY" --out series-scale-results.json | tee series-scale.log
        echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -n 60 series-scale.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Walk the tabular tasks over growing tables
      if: inputs.table_rows != ''
      env:
        ROWS: ${{ inputs.table_rows }}
        TASKS: ${{ inputs.table_tasks }}
        CLASSES: ${{ inputs.table_classes }}
        FEATURES: ${{ inputs.table_features }}
        TIME: ${{ inputs.table_time }}
        SEEDS: ${{ inputs.table_seeds }}
      run: |
        python3 scripts/table-scale.py --mloop "dotnet $PWD/tools/MLoop.CLI/bin/Release/net10.0/mloop.dll" --rows "$ROWS" --tasks "$TASKS" --classes "$CLASSES" --features "$FEATURES" --time "$TIME" --seeds "$SEEDS" --out table-scale-results.json | tee table-scale.log
        echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -n 60 table-scale.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lifecycle-results
        path: |
          lifecycle-results.json
          server.log
          series-scale-results.json
          series-scale.log
          table-scale-results.json
          table-scale.log
        if-no-files-found: ignore
        retention-days: 30
