name: Lifecycle check

# Walks a model through its operating life with the real CLI (scripts/lifecycle-check.py): train, promote, predict with logs, drift,
# feedback, retraining trigger, retrain, paired evaluation, promote, rollback, retrain through a paired gate. The generated text
# scenario needs the libtorch runtime, which CI installs nowhere else, so it runs here on request; the forecasting scenario needs
# ML.NET's MKL native, whose OpenMP runtime this workflow installs. Linux x64.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Comma-separated scenarios (binary, multiclass, regression, text, forecast, anomaly)'
        default: 'text'
      expected:
        description: 'Steps known to fail (a step that turns green is reported as xpass)'
        default: ''
      serve:
        description: 'Also walk the HTTP surface (mloop serve; true or false)'
        default: 'false'
      trials:
        description: 'Trials of the trainer search per training (0 = the time budget alone)'
        default: '10'
      series_rows:
        description: 'Also walk the series tasks over series of these lengths (scripts/series-scale.py; comma-separated, empty = skip)'
        default: ''
      series_tasks:
        description: 'Series tasks for that walk (forecast, anomaly)'
        default: 'forecast,anomaly'
      series_windows:
        description: 'Forecast SSA window sizes to try at every length (comma-separated, empty = the default)'
        default: ''
      series_timeout:
        description: 'Seconds allowed to each step of the series walk (0 = 1800)'
        default: '0'

concurrency:
  group: lifecycle-check-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build the CLI
      run: dotnet build tools/MLoop.CLI -c Release

    - name: Time-series prerequisite
      if: contains(inputs.tasks, 'forecast') || contains(inputs.tasks, 'anomaly') || inputs.series_rows != ''
      # ML.NET's MKL native links an Intel-ABI OpenMP runtime that Linux leaves to the system (TimeSeriesNativeSupport)
      run: |
        sudo apt-get install -y libomp5
        omp=$(find /usr/lib -name 'libomp.so.5' | head -n 1)
        sudo ln -sf "$omp" "$(dirname "$omp")/libiomp5.so"
        sudo ldconfig

    - name: Build the API
      # `mloop serve` starts the API assembly beside the CLI or the one MLOOP_API_PATH names
      if: inputs.serve == 'true'
      run: dotnet build tools/MLoop.API -c Release

    - name: Walk
      if: inputs.tasks != ''
      env:
        TASKS: ${{ inputs.tasks }}
        TRIALS: ${{ inputs.trials }}
        EXPECTED: ${{ inputs.expected }}
        SERVE: ${{ inputs.serve }}
        MLOOP_API_PATH: ${{ github.workspace }}/tools/MLoop.API/bin/Release/net10.0/MLoop.API.dll
      run: |
        python3 scripts/lifecycle-check.py --mloop "dotnet $PWD/tools/MLoop.CLI/bin/Release/net10.0/mloop.dll" \
          --tasks "$TASKS" --trials "$TRIALS" --time 300 $([ "$SERVE" = true ] || echo --no-serve) --expected-failures "$EXPECTED" --server-log server.log --out lifecycle-results.json

    - name: Walk the series tasks over growing lengths
      if: inputs.series_rows != ''
      env:
        ROWS: ${{ inputs.series_rows }}
        TASKS: ${{ inputs.series_tasks }}
        WINDOWS: ${{ inputs.series_windows }}
        STEP_TIMEOUT: ${{ inputs.series_timeout }}
      run: |
        python3 scripts/series-scale.py --mloop "dotnet $PWD/tools/MLoop.CLI/bin/Release/net10.0/mloop.dll" --rows "$ROWS" --tasks "$TASKS" --windows "$WINDOWS" --step-timeout "$STEP_TIMEOUT" --out series-scale-results.json | tee series-scale.log
        echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -n 60 series-scale.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lifecycle-results
        path: |
          lifecycle-results.json
          server.log
          series-scale-results.json
          series-scale.log
        if-no-files-found: ignore
        retention-days: 30
