name: Lifecycle check

# Walks a model through its operating life with the real CLI (scripts/lifecycle-check.py): train, promote, predict with logs, drift,
# feedback, retraining trigger, retrain, paired evaluation, promote, rollback, retrain through a paired gate. The generated text
# scenario needs the libtorch runtime, which CI installs nowhere else, so it runs here on request. Linux x64.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Comma-separated scenarios (binary, multiclass, regression, text, forecast)'
        default: 'text'
      expected:
        description: 'Steps known to fail (a step that turns green is reported as xpass)'
        default: ''
      trials:
        description: 'Trials of the trainer search per training (0 = the time budget alone)'
        default: '10'

concurrency:
  group: lifecycle-check-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build the CLI
      run: dotnet build tools/MLoop.CLI -c Release

    - name: Time-series prerequisite
      if: contains(inputs.tasks, 'forecast')
      # ML.NET's MKL native links an Intel-ABI OpenMP runtime that Linux leaves to the system (TimeSeriesNativeSupport)
      run: |
        sudo apt-get install -y libomp5
        omp=$(find /usr/lib -name 'libomp.so.5' | head -n 1)
        sudo ln -sf "$omp" "$(dirname "$omp")/libiomp5.so"
        sudo ldconfig

    - name: Walk
      env:
        TASKS: ${{ inputs.tasks }}
        TRIALS: ${{ inputs.trials }}
        EXPECTED: ${{ inputs.expected }}
      run: |
        python3 scripts/lifecycle-check.py --mloop "dotnet $PWD/tools/MLoop.CLI/bin/Release/net10.0/mloop.dll" \
          --tasks "$TASKS" --trials "$TRIALS" --time 300 --no-serve --expected-failures "$EXPECTED" --out lifecycle-results.json

    - name: Upload the results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lifecycle-results
        path: lifecycle-results.json
        retention-days: 30
