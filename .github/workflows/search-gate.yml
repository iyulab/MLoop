name: Search gate

# Measures MLoop's trainer search (SearchGateMeasurement in MLoop.Core.Tests): search quality at an equal
# trial count over five seeds, the time budget, and determinism. Run on request —
# it takes tens of minutes and its output is a report to read, not a pass/fail signal. Linux and
# Windows only: LightGBM has no native library for macOS on ARM, so a macOS runner compares one
# trainer fewer.
on:
  workflow_dispatch:

concurrency:
  group: search-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  measure:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build
      run: dotnet build tests/MLoop.Core.Tests --configuration Release

    - name: Measure
      env:
        MLOOP_SEARCH_GATE: '1'
        MLOOP_SEARCH_GATE_OUT: ${{ github.workspace }}/search-gate
      run: dotnet test tests/MLoop.Core.Tests --configuration Release --no-build --filter "FullyQualifiedName~SearchGateMeasurement" --output Detailed

    - name: Keep the report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: search-gate-${{ matrix.os }}
        path: search-gate/
        retention-days: 7
        if-no-files-found: warn
